[package]
authors = ["Maiddog <maiddogsrl@gmail.com>", "BeaconBrigade <beaconbrigade@gmail.com>"]
description = "A Rust library for offline PPI recording with Polar Verity Sense"
documentation = "https://docs.rs/arctic"
homepage = "https://github.com/Roughsketch/arctic"
keywords = ["polar", "bluetooth", "heartrate", "ppi"]
license = "MIT"
name = "arctic"
readme = "README.md"
repository = "https://github.com/Roughsketch/arctic.git"
version = "1.0.0"
edition = "2021"

[lib]
name = "arctic"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3"
btleplug = { version = "0.13.3" }
futures = "0.3"
log = "0.4"
tokio = { version = "1.10.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = "1"

# Used by init_android to bind the JavaVM before handing it to btleplug's
# droidplug backend.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
tokio-test = "0.4"
